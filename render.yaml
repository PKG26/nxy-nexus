services:
  - type: web
    name: nxy-nexus
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NXY_DATA_DIR
        value: /var/data
    disk:
      name: nxy-nexus-data
      mountPath: /var/data
      sizeGB: 1
