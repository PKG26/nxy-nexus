<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator sign in — NXY NEXUS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#090b11;--panel:#11141d;--line:#252a38;--muted:#9299aa;--text:#f4f5f8;--accent:#b7f36b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 30%,#33305d 0,transparent 40%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif;display:grid;place-items:center;padding:22px}a{color:inherit}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px 'Space Grotesk';position:absolute;left:32px;top:27px}.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--accent);color:#111;border-radius:10px}.brand em{color:var(--accent);font-style:normal}.card{width:min(430px,100%);background:#11141deF;border:1px solid var(--line);border-radius:19px;padding:30px;box-shadow:0 24px 80px #0005}.eyebrow{font:10px 'DM Mono';color:var(--accent);letter-spacing:.15em;text-transform:uppercase}.card h1{font:600 30px 'Space Grotesk';margin:8px 0}.sub{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#b3b9c8}.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.submit{width:100%;border:0;border-radius:9px;background:var(--accent);color:#111;padding:13px;font-weight:700;margin-top:7px}.error{color:#ff9196;font-size:11px;min-height:17px;margin:9px 0}.foot{border-top:1px solid var(--line);padding-top:15px;margin-top:17px;color:var(--muted);font-size:11px;text-align:center}.foot a{color:var(--accent);text-decoration:none}.back{font-size:10px;color:var(--muted);text-decoration:none;display:inline-block;margin-top:18px}@media(max-width:500px){.brand{left:20px;top:18px}.card{padding:24px 20px}}
</style></head><body><a class="brand" href="index.html"><span class="mark">N</span><span>NXY <em>NEXUS</em></span></a><main class="card"><div class="eyebrow">Private administrator access</div><h1>Admin sign in</h1><p class="sub">This sign-in is for authorized NXY administrators.</p><form id="login"><div class="field"><label for="email">Email address</label><input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Your password"></div><button class="submit">Sign in&nbsp; ↗</button><div class="error" id="error"></div></form><a class="back" href="index.html">← Back to marketplace</a></main><script>
fetch('/api/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace(s.user.role==='admin'?'admin.html':'dashboard.html')});document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='Signing in…';const body=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok){error.textContent=data.error;return}if(data.user.role!=='admin'){await fetch('/api/logout',{method:'POST',headers:{'content-type':'application/json','x-csrf-token':data.csrf},body:'{}'});error.textContent='This sign-in is for administrators only.';return}location.replace('admin.html')}catch{error.textContent='Can’t reach the NXY service. Please try again.'}};
</script></body></html>
