<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set up administrator — NXY NEXUS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#090b11;--panel:#11141d;--line:#252a38;--muted:#9299aa;--text:#f4f5f8;--accent:#b7f36b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 30%,#33305d 0,transparent 40%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif;display:grid;place-items:center;padding:22px}a{color:inherit}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px 'Space Grotesk';position:absolute;left:32px;top:27px}.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--accent);color:#111;border-radius:10px}.brand em{color:var(--accent);font-style:normal}.card{width:min(430px,100%);background:#11141deF;border:1px solid var(--line);border-radius:19px;padding:30px;box-shadow:0 24px 80px #0005}.eyebrow{font:10px 'DM Mono';color:var(--accent);letter-spacing:.15em;text-transform:uppercase}.card h1{font:600 30px 'Space Grotesk';margin:8px 0}.sub{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:10px;color:#b3b9c8}.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.submit{width:100%;border:0;border-radius:9px;background:var(--accent);color:#111;padding:13px;font-weight:700;margin-top:7px}.error{color:#ff9196;font-size:11px;min-height:17px;margin:9px 0}.back{font-size:10px;color:var(--muted);text-decoration:none;display:inline-block;margin-top:18px}@media(max-width:500px){.brand{left:20px;top:18px}.card{padding:24px 20px}}
</style></head><body><a class="brand" href="index.html"><span class="mark">N</span><span>NXY <em>NEXUS</em></span></a><main class="card"><div class="eyebrow">One-time first admin setup</div><h1>Create the admin account</h1><p class="sub">This option is available only until the first administrator account is created. Choose a strong password and keep it somewhere safe.</p><form id="setup"><div class="field"><label for="username">Administrator name</label><input id="username" name="username" minlength="2" maxlength="40" required autocomplete="name" placeholder="NXY Administrator"></div><div class="field"><label for="email">Administrator email</label><input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password (at least 12 characters)</label><input id="password" type="password" name="password" minlength="12" maxlength="200" required autocomplete="new-password"></div><button class="submit">Create administrator&nbsp; ↗</button><div class="error" id="error" role="status"></div></form><a class="back" href="index.html">← Back to marketplace</a></main><script>
fetch('/api/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.replace(s.user.role==='admin'?'admin.html':'dashboard.html')});document.querySelector('#setup').onsubmit=async e=>{e.preventDefault();const error=document.querySelector('#error'),button=e.submitter;error.textContent='Creating administrator…';button.disabled=true;const body=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/admin/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok){error.textContent=data.error||'Administrator setup could not be completed.';button.disabled=false;return}location.replace('admin.html')}catch{error.textContent='Can’t reach the NXY service. Please try again.';button.disabled=false}};
</script></body></html>
